
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIZDARTS Voice Scorer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
header{background:#f5ce28;color:#111;padding:20px;font-size:26px;font-weight:bold}
main{max-width:440px;margin:auto;padding:18px}
h1{font-size:18px}
.score{font-size:85px;font-weight:bold;margin:15px;color:#f5ce28}
input{width:100%;font-size:35px;text-align:center;padding:12px;border-radius:10px}
button{border:0;border-radius:9px;padding:16px;font-size:19px;font-weight:bold;cursor:pointer}
.games{display:flex;gap:10px}
.games button{flex:1}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.keys button{background:#333;color:white}
.action{background:#f5ce28;width:100%;margin-top:12px}
.small{background:#444;color:white;margin:8px}
#message{color:#f5ce28;min-height:25px}
</style>
</head>
<body>
<header>🎯 WIZDARTS</header>
<main>
<h1>VOICE SCORER</h1>
<div class="games">
<button onclick="reset(501)">501</button>
<button onclick="reset(301)">301</button>
</div>
<div class="score" id="remaining">501</div>
<p>ENTER SCORE</p>
<input id="entry" type="number" min="0" max="180" readonly>
<div class="keys" id="keys"></div>
<button class="action" onclick="submitScore()">SUBMIT SCORE 🔊</button>
<div>
<button class="small" onclick="undo()">UNDO</button>
<button class="small" onclick="reset(start)">RESET</button>
</div>
<p id="message">Ready to play!</p>
</main>
<script>
let start=501,remaining=501,history=[];
const entry=document.getElementById("entry");
const display=document.getElementById("remaining");
const message=document.getElementById("message");
const keys=document.getElementById("keys");

["1","2","3","4","5","6","7","8","9","C","0","⌫"].forEach(k=>{
let b=document.createElement("button");
b.textContent=k;
b.onclick=()=>{
if(k==="C")entry.value="";
else if(k==="⌫")entry.value=entry.value.slice(0,-1);
else if(entry.value.length<3)entry.value+=k;
};
keys.appendChild(b);
});

function speak(text){
speechSynthesis.cancel();
let voice=new SpeechSynthesisUtterance(text);
voice.lang="en-GB";
voice.rate=0.85;
speechSynthesis.speak(voice);
}

function words(n){
const ones=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
if(n<20)return ones[n];
if(n<100)return tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
return ones[Math.floor(n/100)]+" hundred"+(n%100?" and "+words(n%100):"");
}

function submitScore(){
if(entry.value==="")return;
let n=Number(entry.value);
if(!Number.isInteger(n)||n<0||n>180||n>remaining||remaining-n===1){
message.textContent="Invalid score or bust!";
entry.value="";
return;
}
history.push(remaining);
remaining-=n;
display.textContent=remaining;
let call=remaining===0?"Game shot!":words(n);
message.textContent=call.toUpperCase();
speak(call);
entry.value="";
}

function undo(){
if(!history.length)return;
remaining=history.pop();
display.textContent=remaining;
message.textContent="Score corrected";
}

function reset(n){
start=n;remaining=n;history=[];
display.textContent=n;
entry.value="";
message.textContent="Ready to play!";
}
</script>
</body>
</html>
